apis:
- name: Syncari Embed API
  description: >-
    REST API for embedding and automating Syncari. Covers instance provisioning, synapse create/test/activate,
    entity and field pipeline authoring, validation and publishing, Quick Start install, schema (entity/attribute)
    management, entity data read/write, reference datasets, datasets, transactions and KPIs, jobs, sync/synapse
    errors, insights, users and roles. OAuth 2.0 client-credentials bearer tokens; JSON envelope responses with
    cursor pagination.
  humanURL: https://support.syncari.com/hc/en-us/sections/4417407653012-Get-Started-Syncari-API
