aid: syncari
name: Syncari
description: >-
  Syncari is an agentic master data management (MDM) and data unification platform that syncs, cleans, governs and
  activates business data across CRM, marketing, finance, support and warehouse systems from a single unified data
  model. Its multidirectional stateful sync engine connects 50+ prebuilt "Synapse" connectors plus a Python custom
  connector SDK, and orchestrates data through no-code entity and field pipelines, schema studio, merge/dedupe,
  reference datasets and insights. Syncari exposes two public developer surfaces: the Syncari Embed REST API
  (https://api.syncari.com/api/v1) for programmatically provisioning instances, synapses, pipelines, entities,
  datasets, users and roles inside an embedding product, and a hosted remote MCP server at https://mcp.syncari.com/mcp
  that lets Claude and ChatGPT query a customer's unified data and trigger Syncari actions over OAuth.
