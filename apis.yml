- name: Syncari MCP Server
  description: >-
    Hosted remote MCP server that connects Claude (web and desktop) and ChatGPT to a customer's unified Syncari data.
    Documented capabilities include listing the datasets in an instance, running analytical queries against unified
    data, and triggering standard and custom Syncari actions. Authorization is OAuth 2.0 authorization-code with
    PKCE and dynamic client registration; tools/list is auth-gated.
  humanURL: https://support.syncari.com/hc/en-us/sections/37496143927444-MCP-Server-Overview
  baseURL: https://mcp.syncari.com/mcp
