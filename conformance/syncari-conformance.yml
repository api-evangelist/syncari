domain_standard:
  market: Master data management / data integration / iPaaS
  searched:
  - scim
  - odata
  - json-api
  - graphql
  - odbc-jdbc
  - open-data-protocol
  finding: >-
    None declared. Syncari's contract declares no domain data-interchange standard for the MDM market: no SCIM
    schema URNs, no OData $metadata surface, no CDM/Open Data Initiative mapping. Its unified data model is
    proprietary (Syncari entities and attributes, with per-Synapse mapping). This is REWARD-ONLY and the MDM
    segment has no single dominant wire standard, so no penalty is implied - it is recorded so a later pass does
    not re-probe.
  conforms: false
