name: Syncari client libraries and SDKs
description: >-
  Syncari publishes one first-party client library: the Python Synapse Development Kit, used to build custom
  Synapse connectors that Syncari's platform invokes (synapse_info, test, describe, read, CRUD, webhook and
  getHeaders methods, plus a bundled SyncariRestClient with retry/backoff). There is no first-party SDK for the
  Syncari Embed REST API in any other language, and no public Syncari GitHub organisation
  (https://api.github.com/orgs/syncari returned HTTP 404 on 2026-08-29).
