  kind: has_many
  via: dataset columns are modelled as attributes in Schema Studio
- from: EntityData
  to: EntityData
  kind: has_many
  via: 'reference / child data-type attributes hold cross-entity references'
sdk_record_model:
  source: https://support.syncari.com/hc/en-us/articles/25947440030356-Models-Reference-Page
  Record:
    name: Entity name of the record
    id: ID in the external system
    syncariEntityId: ID in Syncari
    deleted: boolean
    values: field values dictionary
    lastModified: epoch millis
    createdAt: epoch millis
  note: >-
    The id / syncariEntityId pair IS the identity-resolution join - the external system's key on one side, the
    Syncari golden-record key on the other. Create/Update/Delete return Result objects that establish this mapping.
system_fields:
  observed: [id, createdBy, createdAt, updatedBy, updatedAt, status]
  data_plane: [syncari_updatedbyemail, syncariDefinedUpdatedAt]
