- from: Instance
  to: Entity
  kind: has_many
  via: syncariId header
- from: Instance
  to: Pipeline
  kind: has_many
  via: syncariId header
- from: Instance
  to: User
  kind: has_many
  via: instance assignment on the user
- from: Entity
