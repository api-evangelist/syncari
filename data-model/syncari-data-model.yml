  kind: belongs_to
  via: source/destination node references synapseId
- from: Pipeline
  to: Entity
  kind: belongs_to
  via: the Syncari entity the pipeline syncs
- from: Synapse
  to: SynapseType
  kind: belongs_to
  via: synapseTypeId
- from: Synapse
