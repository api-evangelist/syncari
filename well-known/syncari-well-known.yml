  (RFC 9728) that the MCP 401 challenge points at. No security.txt, api-catalog, openid-configuration, ai-plugin
  or A2A agent card is served anywhere. app.syncari.com answers 200 with the same 6,282-byte SPA HTML shell for
  every path probed, including paths that cannot exist - those are recorded as misses, not documents.
